<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui; background:#0f172a; color:#e2e8f0; padding:20px; max-width:1000px; margin:auto; }
  h1 { color:#38bdf8; margin-bottom:4px; }
  .sub { color:#94a3b8; margin-top:0; font-size:0.9rem; }
  h2 { color:#7dd3fc; font-size:1rem; margin-top:24px; }
  button { background:#0ea5e9; color:white; border:none; padding:12px 24px; border-radius:8px;
    font-size:1rem; font-weight:600; cursor:pointer; margin:4px 4px 4px 0; }
  button:disabled { background:#475569; cursor:not-allowed; }
  button.secondary { background:#475569; }
  #log { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px;
    margin-top:16px; max-height:400px; overflow-y:auto; font-family:monospace; font-size:0.8rem; }
  .ok { color:#4ade80; } .err { color:#f87171; } .info { color:#94a3b8; } .warn { color:#fbbf24; }
  .prog { color:#c084fc; }
  .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin:16px 0; }
  .stat { background:#0f172a; border:1px solid #334155; border-radius:6px; padding:10px; text-align:center; }
  .stat-num { color:#38bdf8; font-size:1.3rem; font-weight:700; }
  .stat-lbl { color:#94a3b8; font-size:0.7rem; text-transform:uppercase; }
  .modo { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px; margin:12px 0; }
  .modo label { display:flex; align-items:center; gap:8px; color:#cbd5e1; padding:6px 0; }
  input[type="checkbox"] { width:18px; height:18px; }
  input[type="number"] { width:80px; background:#0f172a; border:1px solid #334155;
    color:#e2e8f0; padding:4px 8px; border-radius:4px; font-size:0.95rem; }
  .categorias { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .cat-chip {
    background:#334155; color:#cbd5e1; padding:4px 10px; border-radius:12px;
    font-size:0.78rem; cursor:pointer; user-select:none; border:2px solid transparent;
  }
  .cat-chip.on { background:#0ea5e9; color:white; border-color:#38bdf8; }
</style>
</head>
<body>
<h1>🌐 Recolector</h1>
<p class="sub">Descarga Wikipedia + APIs y genera JSON con estructura de entrenamiento (compatible con cerebro.html)</p>

<div class="modo">
  <strong style="color:#7dd3fc">1. Categorías a incluir:</strong>
  <div class="categorias" id="catsBox"></div>
  <button id="allCat" class="secondary">Todas</button>
  <button id="noneCat" class="secondary">Ninguna</button>
</div>

<div class="modo">
  <strong style="color:#7dd3fc">2. Configuración:</strong>
  <label>
    Límite de artículos ES:
    <input type="number" id="numES" value="150" min="10" max="500" />
  </label>
  <label>
    Límite de artículos EN:
    <input type="number" id="numEN" value="30" min="5" max="200" />
  </label>
  <label><input type="checkbox" id="cbApis" checked> Incluir APIs adicionales (clima, sismos, NASA)</label>
  <label><input type="checkbox" id="cbPatrones" checked> Generar patrones conversacionales (recomendado)</label>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="statTags">0</div><div class="stat-lbl">Tags</div></div>
  <div class="stat"><div class="stat-num" id="statPatrones">0</div><div class="stat-lbl">Patrones</div></div>
  <div class="stat"><div class="stat-num" id="statErr">0</div><div class="stat-lbl">Errores</div></div>
  <div class="stat"><div class="stat-num" id="statMB">0</div><div class="stat-lbl">MB</div></div>
</div>

<button id="go">🚀 Iniciar recolección</button>
<button id="dl" class="secondary" disabled>💾 Descargar entrenamiento.json</button>
<button id="clearLog" class="secondary">🗑 Limpiar log</button>

<div id="log"></div>

// ============================================================
// FETCH con timeout
// ============================================================
async function fetchT(url, ms=25000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return { ok: true, text: await r.text() };
  } catch (e) {
    clearTimeout(t);
    return { ok: false, error: e.message };
  }
}

// ============================================================
// WIKIPEDIA COMPLETO
// ============================================================
async function fetchWikipedia(titulo, idioma = 'es') {
  const api = `https://${idioma}.wikipedia.org/w/api.php?` +
    `action=query&` +
    `titles=${encodeURIComponent(titulo)}&` +
    `prop=extracts&` +
    `explaintext=1&` +
    `exsectionformat=plain&` +
    `redirects=1&` +
    `format=json&` +
    `origin=*`;
  const r = await fetchT(api, 30000);
  if (!r.ok) return null;
  try {
    const j = JSON.parse(r.text);
    const pages = j.query?.pages || {};
    const pageId = Object.keys(pages)[0];
    if (!pageId || pageId === '-1') return null;
    const page = pages[pageId];
    if (!page.extract || page.extract.length < 300) return null;
    return {
      titulo: page.title,
      texto: page.extract,
      url: `https://${idioma}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
    };
  } catch (e) {
    return null;
  }
}

// ============================================================
// GENERADORES
// ============================================================
function generarPatrones(nombre) {
  const patrones = new Set();
  for (const plantilla of PLANTILLAS) {
    const base = plantilla.replace(/\{t\}/g, nombre);
    for (const variante of VARIANTES) {
      const texto = variante(base).trim();
      if (texto) patrones.add(texto);
    }
  }
  return [...patrones];
}

function generarRespuestas(nombre, extracto) {
  if (!extracto) {
    return [
      `No tengo información detallada sobre **${nombre}** en mi base actual. ¿Quieres que lo busquemos juntos?`
    ];
  }

  // Divide en párrafos
  const parrafos = extracto.split(/\n\n+/).filter(p => p.trim().length > 100);
  const primerParrafo = parrafos[0] || extracto.slice(0, 800);
  const resumen = primerParrafo.slice(0, 900).replace(/\s+/g, ' ').trim();

  // Respuesta 1: directa/formal
  const r1 = `**${nombre}**\n\n${resumen}\n\n¿Quieres que profundice en algo?`;

  // Respuesta 2: estilo Ania casual
  const r2 = `¡Órale! De **${nombre}** te cuento:\n\n${resumen}\n\n¿Te sirve así o seguimos con más?`;

  // Respuesta 3: cubana
  const r3 = `Asere, sobre **${nombre}**:\n\n${resumen}\n\n¿Quieres más o pasamos a otra cosa?`;

  // Respuesta 4: si hay más párrafos, resumen extendido
  if (parrafos.length > 1) {
    const segundos = parrafos.slice(1, 3).join(' ').slice(0, 700).replace(/\s+/g, ' ');
    const r4 = `**${nombre}** (más detalles)\n\n${resumen}\n\nAdemás: ${segundos}`;
    return [r1, r2, r3, r4];
  }

  return [r1, r2, r3];
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  const dlBtn = document.getElementById('dl');
  btn.disabled = true;
  dlBtn.disabled = true;
  logEl.innerHTML = '';

  stats = { tags: 0, patrones: 0, errores: 0, bytes: 0 };
  updateStats();

  const numES = Math.min(500, Math.max(10, parseInt(document.getElementById('numES').value) || 150));
  const numEN = Math.min(200, Math.max(5, parseInt(document.getElementById('numEN').value) || 30));
  const usarAPIs = document.getElementById('cbApis').checked;
  const usarPatrones = document.getElementById('cbPatrones').checked;

  // Filtrar temas
  let temasES = TEMAS.filter(t => categoriasActivas.has(t.c)).slice(0, numES);
  let temasEN = [
    { tag:'ai_en', n:'Artificial intelligence', c:'ciencia' },
    { tag:'ml_en', n:'Machine learning', c:'ciencia' },
    { tag:'quantum_en', n:'Quantum computing', c:'ciencia' },
    { tag:'climate_en', n:'Climate change', c:'ciencia' },
    { tag:'space_en', n:'Space exploration', c:'ciencia' },
    { tag:'www_en', n:'World Wide Web', c:'tecnologia' },
    { tag:'internet_en', n:'Internet', c:'tecnologia' },
    { tag:'cs_en', n:'Computer science', c:'tecnologia' },
    { tag:'os_en', n:'Operating system', c:'tecnologia' },
    { tag:'db_en', n:'Database', c:'tecnologia' },
    { tag:'wwii_en', n:'World War II', c:'historia' },
    { tag:'coldwar_en', n:'Cold War', c:'historia' },
    { tag:'math_en', n:'Mathematics', c:'matematicas' },
    { tag:'physics_en', n:'Physics', c:'ciencia' },
    { tag:'chem_en', n:'Chemistry', c:'ciencia' },
    { tag:'bio_en', n:'Biology', c:'ciencia' },
    { tag:'philo_en', n:'Philosophy', c:'filosofia' },
    { tag:'econ_en', n:'Economics', c:'economia' },
    { tag:'psych_en', n:'Psychology', c:'salud' }
  ].slice(0, numEN);

  log('🚀 Iniciando recolección...', 'prog');
  log('📊 Temas ES: ' + temasES.length + ' · Temas EN: ' + temasEN.length, 'info');

  // Test de conectividad
  const test = await fetchWikipedia('España', 'es');
  if (!test) {
    log('❌ Wikipedia API no responde. Revisa la conexión.', 'err');
    btn.disabled = false;
    return;
  }
  log('✅ Wikipedia API funciona (test: ' + test.texto.length + ' chars)', 'ok');

  const entrenamiento = [];

  // ========== Procesar temas ES ==========
  log('📚 Procesando Wikipedia ES...', 'prog');
  const tareasES = temasES.map(tema => async () => {
    const wiki = await fetchWikipedia(tema.n, 'es');
    const patrones = usarPatrones ? generarPatrones(tema.n) : [tema.n];
    const respuestas = generarRespuestas(tema.n, wiki?.texto || '');

    entrenamiento.push({
      tag: tema.tag,
      categoria: tema.c,
      tema: tema.n,
      patterns: patrones,
      responses: respuestas,
      meta: {
        categoria: tema.c,
        fuente: wiki?.url || null,
        longitud_texto: wiki?.texto.length || 0,
        idioma: 'es',
        tiene_contenido: !!wiki
      }
    });

    stats.tags++;
    stats.patrones += patrones.length;
    if (!wiki) stats.errores++;
    updateStats();

    if (stats.tags % 5 === 0) {
      log('✓ ' + stats.tags + ' tags · ' + stats.patrones + ' patrones · ' + (stats.bytes/1024/1024).toFixed(2) + ' MB', 'ok');
    }
  });
  await conLimite(tareasES, 4);

  // ========== Procesar temas EN ==========
  log('📚 Procesando Wikipedia EN...', 'prog');
  const tareasEN = temasEN.map(tema => async () => {
    const wiki = await fetchWikipedia(tema.n, 'en');
    const patrones = usarPatrones ? generarPatrones(tema.n) : [tema.n];
    const respuestas = generarRespuestas(tema.n, wiki?.texto || '');

    entrenamiento.push({
      tag: tema.tag,
      categoria: tema.c,
      tema: tema.n,
      patterns: patrones,
      responses: respuestas,
      meta: {
        categoria: tema.c,
        fuente: wiki?.url || null,
        longitud_texto: wiki?.texto.length || 0,
        idioma: 'en',
        tiene_contenido: !!wiki
      }
    });

    stats.tags++;
    stats.patrones += patrones.length;
    if (!wiki) stats.errores++;
    updateStats();
  });
  await conLimite(tareasEN, 4);

  // ========== APIs ==========
  if (usarAPIs) {
    log('📡 Procesando APIs...', 'prog');
    for (const api of APIS) {
      try {
        const r = await fetchT(api.u, 20000);
        if (r.ok) {
          let txt = r.text;
          try { txt = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) {}
          if (txt.length > 200) {
            const patrones = [
              api.n,
              'dame ' + api.n,
              'info de ' + api.n,
              'qué es ' + api.n,
              'cuéntame de ' + api.n
            ];
            entrenamiento.push({
              tag: 'api_' + api.n,
              categoria: 'api',
              tema: api.n,
              patterns: patrones,
              responses: [
                '**' + api.n + '** (datos en tiempo real):\n\n' + txt.slice(0, 1500)
              ],
              meta: {
                categoria: 'api',
                fuente: api.u,
                longitud_texto: txt.length,
                tipo: 'api'
              }
            });
            stats.tags++;
            stats.patrones += patrones.length;
            log('✓ API ' + api.n, 'ok');
          }
        } else {
          stats.errores++;
          log('✗ API ' + api.n + ': ' + r.error, 'err');
        }
      } catch (e) {
        stats.errores++;
      }
      updateStats();
    }
  }

  // ========== Construir JSON final con estructura Ania ==========
  const salida = {
    metadata: {
      version: '1.0',
      descripcion: 'Dataset generado por recolector.html — Wikipedia + APIs con estructura Ania',
      creado_por: 'Recolector (GitHub Pages)',
      fecha_actualizacion: new Date().toISOString(),
      contadores: {
        total_tags: stats.tags,
        total_patrones: stats.patrones,
        total_errores: stats.errores,
        categorias_incluidas: [...categoriasActivas]
      }
    },
    configuracion: {
      categorias: [...categoriasActivas],
      num_plantillas: PLANTILLAS.length,
      num_variantes: VARIANTES.length,
      incluye_wikipedia: true,
      incluye_apis: usarAPIs
    },
    entrenamiento
  };

  // Calcular bytes reales
  const json = JSON.stringify(salida);
  stats.bytes = new Blob([json]).size;
  updateStats();

  resultado = salida;

  log('', 'info');
  log('✅ COMPLETADO', 'ok');
  log('📊 Tags: ' + stats.tags + ' · Patrones: ' + stats.patrones + ' · Errores: ' + stats.errores, 'ok');
  log('📦 Tamaño: ' + (stats.bytes/1024/1024).toFixed(2) + ' MB', 'ok');

  dlBtn.disabled = false;
  btn.disabled = false;
});

// Concurrencia limitada
async function conLimite(tareas, limite) {
  const cola = [...tareas];
  const workers = Array(limite).fill(0).map(async () => {
    while (cola.length) {
      const t = cola.shift();
      try { await t(); } catch (e) { stats.errores++; }
    }
  });
  await Promise.all(workers);
}

document.getElementById('dl').addEventListener('click', () => {
  if (!resultado) return;
  const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'entrenamiento.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log('💾 entrenamiento.json descargado (' + (blob.size/1024/1024).toFixed(2) + ' MB)', 'ok');
});
