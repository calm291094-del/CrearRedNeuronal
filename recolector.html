<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌐 Recolector v2 — Artículos completos</title>
<style>
  body { font-family: system-ui; background:#0f172a; color:#e2e8f0; padding:20px; max-width:900px; margin:auto; }
  h1 { color:#38bdf8; }
  button { background:#0ea5e9; color:white; border:none; padding:12px 24px; border-radius:8px;
    font-size:1rem; font-weight:600; cursor:pointer; margin:4px 4px 4px 0; }
  button:disabled { background:#475569; cursor:not-allowed; }
  button.secondary { background:#475569; }
  #log { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px;
    margin-top:16px; max-height:500px; overflow-y:auto; font-family:monospace; font-size:0.8rem; }
  .ok { color:#4ade80; } .err { color:#f87171; } .info { color:#94a3b8; } .warn { color:#fbbf24; }
  .prog { color:#c084fc; }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:16px 0; }
  .stat { background:#0f172a; border:1px solid #334155; border-radius:6px; padding:10px; text-align:center; }
  .stat-num { color:#38bdf8; font-size:1.3rem; font-weight:700; }
  .stat-lbl { color:#94a3b8; font-size:0.7rem; text-transform:uppercase; }
  .modo { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px; margin:12px 0; }
  .modo label { display:flex; align-items:center; gap:8px; color:#cbd5e1; padding:6px 0; }
  input[type="checkbox"] { width:18px; height:18px; }
  input[type="number"] { width:70px; background:#0f172a; border:1px solid #334155;
    color:#e2e8f0; padding:4px 8px; border-radius:4px; }
</style>
</head>
<body>
<h1>🌐 Recolector v2</h1>
<p style="color:#94a3b8">Descarga artículos COMPLETOS de Wikipedia (20-200 KB cada uno)</p>

<div class="modo">
  <strong style="color:#7dd3fc">Configuración:</strong>
  <label>
    Nº artículos completos ES:
    <input type="number" id="numES" value="50" min="10" max="300" />
  </label>
  <label>
    Nº artículos completos EN:
    <input type="number" id="numEN" value="20" min="5" max="100" />
  </label>
  <label><input type="checkbox" id="cbApis" checked> APIs (clima, países, cripto, NASA, GitHub)</label>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="statOk">0</div><div class="stat-lbl">OK</div></div>
  <div class="stat"><div class="stat-num" id="statErr">0</div><div class="stat-lbl">Errores</div></div>
  <div class="stat"><div class="stat-num" id="statMB">0</div><div class="stat-lbl">MB</div></div>
</div>

<button id="go">🚀 Iniciar recolección</button>
<button id="dl" class="secondary" disabled>💾 Descargar conocimiento.json</button>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');
let resultado = { generado: new Date().toISOString(), fuente: 'github-pages-v2', datos: {} };
let okCount = 0, errCount = 0, totalBytes = 0;

function log(msg, cls='info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function updateStats() {
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statErr').textContent = errCount;
  document.getElementById('statMB').textContent = (totalBytes/1024/1024).toFixed(2);
}

async function fetchT(url, ms=25000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return { ok: true, text: await r.text() };
  } catch (e) {
    clearTimeout(t);
    return { ok: false, error: e.message };
  }
}

function guardar(nombre, contenido) {
  if (!contenido || !String(contenido).trim()) return false;
  const s = String(contenido);
  if (s.length < 200) return false; // ignorar artículos muy cortos
  resultado.datos[nombre] = { contenido: s };
  totalBytes += new Blob([s]).size;
  okCount++;
  return true;
}

// ============================================================
// WIKIPEDIA COMPLETO — MediaWiki API (extracto entero)
// ============================================================
async function fetchArticuloCompleto(titulo, idioma) {
  // explaintext=1 devuelve texto plano sin HTML
  // exsectionformat=plain evita "=="
  // redirects=1 sigue redirecciones
  const api = `https://${idioma}.wikipedia.org/w/api.php?` +
    `action=query&` +
    `titles=${encodeURIComponent(titulo)}&` +
    `prop=extracts&` +
    `explaintext=1&` +
    `exsectionformat=plain&` +
    `redirects=1&` +
    `format=json&` +
    `origin=*`;

  const r = await fetchT(api, 30000);
  if (!r.ok) return null;

  try {
    const j = JSON.parse(r.text);
    const pages = j.query?.pages || {};
    const pageId = Object.keys(pages)[0];
    if (!pageId) return null;
    const page = pages[pageId];
    if (!page.extract || page.extract.length < 300) return null;
    return {
      titulo: page.title,
      texto: page.extract,
      url: `https://${idioma}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
    };
  } catch (e) {
    return null;
  }
}

const TEMAS_ES = [
  // Ciencia
  'Inteligencia artificial','Aprendizaje automático','Red neuronal artificial','Aprendizaje profundo',
  'Procesamiento de lenguajes naturales','Visión artificial','Algoritmo','Estructura de datos',
  'Física','Química','Biología','Matemáticas','Astronomía','Genética','Ecología',
  'Mecánica cuántica','Relatividad general','Teoría de cuerdas','Evolución biológica','ADN',
  'Sistema solar','Vía Láctea','Agujero negro','Big Bang','Materia oscura',
  'Tabla periódica de los elementos','Átomo','Molécula','Protón','Neutrón','Electrón','Fotón',
  // Tecnología
  'Internet','World Wide Web','Computadora','Programación','Python (lenguaje de programación)',
  'JavaScript','Linux','Windows','Android','iOS','Blockchain','Bitcoin','Ciberseguridad',
  'Computación cuántica','Computación en la nube','Big data','Inteligencia artificial general',
  // Historia
  'Historia universal','Antigua Roma','Antigua Grecia','Antiguo Egipto','Imperio romano',
  'Edad Media','Renacimiento','Revolución francesa','Revolución Industrial',
  'Primera Guerra Mundial','Segunda Guerra Mundial','Guerra Fría','Cristóbal Colón',
  // Geografía
  'España','Cuba','México','Argentina','Colombia','Perú','Chile','Venezuela','Uruguay',
  'Estados Unidos','Francia','Alemania','Italia','Reino Unido','Rusia','China','Japón','India','Brasil',
  'La Habana','Madrid','Barcelona','Ciudad de México','Buenos Aires',
  'Río Amazonas','Nilo','Everest','Sahara','Antártida','Océano Pacífico','Océano Atlántico',
  // Filosofía y pensamiento
  'Filosofía','Sócrates','Platón','Aristóteles','René Descartes','Immanuel Kant',
  'Friedrich Nietzsche','Karl Marx','Sigmund Freud','Carl Jung','Jean-Paul Sartre',
  // Salud
  'Medicina','Anatomía humana','Corazón','Cerebro humano','Sistema nervioso','Sistema inmunitario',
  'Cáncer','Diabetes','COVID-19','Nutrición','Salud mental','Depresión','Ansiedad',
  // Arte y cultura
  'Arte','Pintura','Escultura','Música','Literatura','Poesía','Cine','Teatro','Fotografía',
  'Pablo Picasso','Leonardo da Vinci','Vincent van Gogh','Miguel de Cervantes',
  'Gabriel García Márquez','Federico García Lorca','William Shakespeare','Frida Kahlo',
  'Anime','Manga','Estudio Ghibli','Hayao Miyazaki',
  // Economía y política
  'Economía','Capitalismo','Socialismo','Comunismo','Democracia','Inflación',
  'Producto interno bruto','Bolsa de valores','Globalización',
  // Deportes
  'Fútbol','Baloncesto','Béisbol','Tenis','Ajedrez','Juegos Olímpicos','Copa Mundial de Fútbol',
  // Matemáticas
  'Número pi','Número e','Teorema de Pitágoras','Cálculo infinitesimal','Álgebra','Geometría',
  'Estadística','Probabilidad','Teoría de conjuntos','Lógica matemática'
];

const TEMAS_EN = [
  'Artificial intelligence','Machine learning','Deep learning','Quantum computing',
  'Climate change','Sustainable energy','Neuroscience','Biotechnology','Nanotechnology',
  'Space exploration','International Space Station','Computer science','Programming language',
  'Data science','Cryptography','World War II','Industrial Revolution','Internet',
  'World Wide Web','Operating system','Database','Cloud computing','Software engineering',
  'Mathematics','Physics','Chemistry','Biology','Philosophy','Economics','Psychology'
];

async function recolectarWikipediaCompleta(temas, idioma, prefijo) {
  log('📚 Wikipedia ' + idioma.toUpperCase() + ' completa (' + temas.length + ' artículos)...', 'prog');
  let completados = 0;
  const tareas = temas.map(titulo => async () => {
    const art = await fetchArticuloCompleto(titulo, idioma);
    if (art) {
      const contenido = '# ' + art.titulo + '\n\n' + art.texto + '\n\nFuente: ' + art.url;
      if (guardar(prefijo + '_' + titulo.replace(/\s+/g, '_'), contenido)) {
        completados++;
      }
    } else {
      errCount++;
    }
    updateStats();
    if (completados % 5 === 0 && completados > 0) {
      log('✓ ' + completados + ' artículos completos · ' + (totalBytes/1024/1024).toFixed(2) + ' MB', 'ok');
    }
  });
  await conLimite(tareas, 3); // menos concurrencia, artículos pesados
  log('📚 Wikipedia ' + idioma.toUpperCase() + ' terminada: ' + completados + ' artículos', 'ok');
}

async function conLimite(tareas, limite) {
  const cola = [...tareas];
  await Promise.all(Array(limite).fill(0).map(async () => {
    while (cola.length) await cola.shift()();
  }));
}

// ============================================================
// APIs con CORS abierto
// ============================================================
const APIS = [
  { n:'countries_all', u:'https://restcountries.com/v3.1/all?fields=name,capital,population,region,languages,currencies' },
  { n:'meteo_madrid', u:'https://api.open-meteo.com/v1/forecast?latitude=40.4168&longitude=-3.7038&current=temperature_2m,wind_speed_10m,humidity' },
  { n:'meteo_habana', u:'https://api.open-meteo.com/v1/forecast?latitude=23.1136&longitude=-82.3666&current=temperature_2m,wind_speed_10m' },
  { n:'meteo_buenos_aires', u:'https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current=temperature_2m' },
  { n:'usgs_sismos', u:'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=30&orderby=time' },
  { n:'iss_location', u:'http://api.open-notify.org/iss-now.json' },
  { n:'iss_people', u:'http://api.open-notify.org/astros.json' }
];

async function recolectarAPIs() {
  log('📡 APIs...', 'prog');
  for (const a of APIS) {
    try {
      const r = await fetchT(a.u, 20000);
      if (r.ok) {
        let txt = r.text;
        try { txt = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) {}
        guardar('api_' + a.n, txt);
        log('✓ ' + a.n + ' (' + (txt.length/1024).toFixed(1) + ' KB)', 'ok');
      } else {
        errCount++;
        log('✗ ' + a.n + ': ' + r.error, 'err');
      }
    } catch (e) {
      errCount++;
    }
    updateStats();
  }
}

// ============================================================
// MAIN
// ============================================================
document.getElementById('go').addEventListener('click', async () => {
  document.getElementById('go').disabled = true;
  logEl.innerHTML = '';
  resultado = { generado: new Date().toISOString(), fuente: 'github-pages-v2', datos: {} };
  okCount = 0; errCount = 0; totalBytes = 0;

  const numES = Math.min(300, Math.max(10, parseInt(document.getElementById('numES').value) || 50));
  const numEN = Math.min(100, Math.max(5, parseInt(document.getElementById('numEN').value) || 20));

  log('🚀 Iniciando recolección v2 (artículos completos)...', 'prog');

  // Test
  const test = await fetchArticuloCompleto('España', 'es');
  if (!test) {
    log('❌ Wikipedia API no responde correctamente', 'err');
    document.getElementById('go').disabled = false;
    return;
  }
  log('✅ Wikipedia API funciona (test: ' + test.texto.length + ' chars)', 'ok');

  // ES
  const temasES = TEMAS_ES.slice(0, numES);
  await recolectarWikipediaCompleta(temasES, 'es', 'wiki_es');

  // EN
  const temasEN = TEMAS_EN.slice(0, numEN);
  await recolectarWikipediaCompleta(temasEN, 'en', 'wiki_en');

  // APIs
  if (document.getElementById('cbApis').checked) {
    await recolectarAPIs();
  }

  log('', 'info');
  log('✅ COMPLETADO: ' + okCount + ' OK, ' + errCount + ' errores', 'ok');
  log('📦 Total: ' + (totalBytes/1024/1024).toFixed(2) + ' MB', 'ok');
  document.getElementById('dl').disabled = false;
  document.getElementById('go').disabled = false;
});

document.getElementById('dl').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'conocimiento.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log('💾 conocimiento.json descargado (' + (blob.size/1024/1024).toFixed(2) + ' MB)', 'ok');
});
</script>
</body>
</html>
