  .stat { background:#0f172a; border:1px solid #334155; border-radius:6px; padding:10px; text-align:center; }
  .stat-num { color:#38bdf8; font-size:1.3rem; font-weight:700; }
  .stat-lbl { color:#94a3b8; font-size:0.7rem; text-transform:uppercase; }
  .modo { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px; margin:12px 0; }
  .modo label { display:flex; align-items:center; gap:8px; color:#cbd5e1; padding:6px 0; }
  input[type="checkbox"] { width:18px; height:18px; }
  input[type="number"] { width:80px; background:#0f172a; border:1px solid #334155;
    color:#e2e8f0; padding:4px 8px; border-radius:4px; font-size:0.95rem; }
  .categorias { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .cat-chip {
    background:#334155; color:#cbd5e1; padding:4px 10px; border-radius:12px;
    font-size:0.75rem; cursor:pointer; user-select:none; border:2px solid transparent;
  }

<h1>🌐 Recolector Universal</h1>
<p class="sub">Ania: doctora · enfermera · ingeniera informática · fotógrafa · astrónoma · cinéfila · otaku · programadora Python</p>

<div class="modo">

  <button id="allCat" class="secondary">Todas</button>
  <button id="noneCat" class="secondary">Ninguna</button>
</div>

<div class="modo">
  <strong style="color:#7dd3fc">2. Configuración:</strong>
  <label>
    Límite de artículos ES:
    <input type="number" id="numES" value="200" min="10" max="500" />
  </label>
  <label>
    Límite de artículos EN:
    <input type="number" id="numEN" value="30" min="5" max="200" />
  </label>
  <label><input type="checkbox" id="cbApis" checked> Incluir APIs adicionales</label>
  <label><input type="checkbox" id="cbPatrones" checked> Generar patrones conversacionales</label>
  <label><input type="checkbox" id="cbCodigo" checked> Incluir ejemplos de código Python</label>
</div>

  <div class="stat"><div class="stat-num" id="statErr">0</div><div class="stat-lbl">Errores</div></div>
  <div class="stat"><div class="stat-num" id="statMB">0</div><div class="stat-lbl">MB</div></div>
</div>

def fibonacci(n):
    """Genera los primeros n números de Fibonacci."""
    secuencia = [0, 1]
    for i in range(2, n):
        secuencia.append(secuencia[-1] + secuencia[-2])
    return secuencia[:n]

    return fib_recursivo(n-1) + fib_recursivo(n-2)

// ============================================================
// FETCH con timeout
// ============================================================
async function fetchT(url, ms=25000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return { ok: true, text: await r.text() };
  } catch (e) {
    clearTimeout(t);
    return { ok: false, error: e.message };
  }
}

async function fetchWikipedia(titulo, idioma = 'es') {
  const api = `https://${idioma}.wikipedia.org/w/api.php?` +
    `action=query&` +
    `titles=${encodeURIComponent(titulo)}&` +
    `prop=extracts&` +
    `explaintext=1&` +
    `exsectionformat=plain&` +
    `redirects=1&` +
    `format=json&` +
    `origin=*`;
  const r = await fetchT(api, 30000);
  if (!r.ok) return null;
  try {
    const j = JSON.parse(r.text);
    const pages = j.query?.pages || {};
    const pageId = Object.keys(pages)[0];
    if (!pageId || pageId === '-1') return null;
    const page = pages[pageId];
    if (!page.extract || page.extract.length < 300) return null;
    return {
      titulo: page.title,
      texto: page.extract,
      url: `https://${idioma}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
    };
  } catch (e) {
    return null;
  }
}

function generarPatrones(nombre) {
  const patrones = new Set();
  for (const plantilla of PLANTILLAS) {
    const base = plantilla.replace(/\{t\}/g, nombre);
    for (const variante of VARIANTES) {
      const texto = variante(base).trim();
      if (texto) patrones.add(texto);
    }
  }
  return [...patrones];
}

function generarRespuestas(nombre, extracto, categoria) {
  if (!extracto) {
    return [
      `No tengo información detallada sobre **${nombre}** en mi base actual. ¿Quieres que lo busquemos juntos?`
    ];
  }

  const parrafos = extracto.split(/\n\n+/).filter(p => p.trim().length > 100);
  const primerParrafo = parrafos[0] || extracto.slice(0, 800);
  const resumen = primerParrafo.slice(0, 900).replace(/\s+/g, ' ').trim();

  const r1 = `**${nombre}**\n\n${resumen}\n\n¿Quieres que profundice en algo?`;
  const r2 = `¡Órale! De **${nombre}** te cuento:\n\n${resumen}\n\n¿Te sirve así o seguimos con más?`;
  const r3 = `Asere, sobre **${nombre}**:\n\n${resumen}\n\n¿Quieres más o pasamos a otra cosa?`;

  // Respuestas especiales por categoría
  if (categoria === 'medicina') {
    const r4 = `**${nombre}** — Información médica\n\n${resumen}\n\n⚠️ Recuerda: siempre consulta a un médico antes de tomar cualquier medicamento.`;
    return [r1, r2, r3, r4];
  }
  if (categoria === 'python') {
    const r4 = `**${nombre}** en Python\n\n${resumen}\n\n¿Quieres que te muestre un ejemplo de código?`;
    return [r1, r2, r3, r4];
  }
  if (categoria === 'fotografia') {
    const r4 = `**${nombre}** — Fotografía\n\n${resumen}\n\n¿Quieres consejos prácticos para aplicarlo?`;
    return [r1, r2, r3, r4];
  }

  if (parrafos.length > 1) {
    const segundos = parrafos.slice(1, 3).join(' ').slice(0, 700).replace(/\s+/g, ' ');
    const r4 = `**${nombre}** (más detalles)\n\n${resumen}\n\nAdemás: ${segundos}`;
    return [r1, r2, r3, r4];
  }

  return [r1, r2, r3];
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  const dlBtn = document.getElementById('dl');
  btn.disabled = true;
  dlBtn.disabled = true;
  logEl.innerHTML = '';

  stats = { tags: 0, patrones: 0, errores: 0, bytes: 0 };
  updateStats();

  const numES = Math.min(500, Math.max(10, parseInt(document.getElementById('numES').value) || 200));
  const numEN = Math.min(200, Math.max(5, parseInt(document.getElementById('numEN').value) || 30));
  const usarAPIs = document.getElementById('cbApis').checked;
  const usarPatrones = document.getElementById('cbPatrones').checked;
  const usarCodigo = document.getElementById('cbCodigo').checked;

  let temasES = TEMAS.filter(t => categoriasActivas.has(t.c)).slice(0, numES);
  log('🚀 Iniciando recolección...', 'prog');
  log('📊 Temas activos: ' + temasES.length + ' en ' + categoriasActivas.size + ' categorías', 'info');

  const test = await fetchWikipedia('España', 'es');
  if (!test) {
    log('❌ Wikipedia API no responde.', 'err');
    btn.disabled = false;
    return;
  }
  log('✅ Wikipedia API funciona (test: ' + test.texto.length + ' chars)', 'ok');

  const entrenamiento = [];

  // ========== Procesar temas ==========
  log('📚 Procesando Wikipedia...', 'prog');
  const tareasES = temasES.map(tema => async () => {
    const wiki = await fetchWikipedia(tema.n, 'es');
    const patrones = usarPatrones ? generarPatrones(tema.n) : [tema.n];
    const respuestas = generarRespuestas(tema.n, wiki?.texto || '', tema.c);

    // Si es tema de Python y hay código, añadir código como respuesta extra
    if (tema.c === 'python' && usarCodigo && CODIGOS_PYTHON[tema.tag]) {
      respuestas.push('**Código de ejemplo:**\\n\\n```python\\n' + CODIGOS_PYTHON[tema.tag] + '\\n```');
      respuestas.push('Aquí tienes un ejemplo de código Python:\\n\\n```python\\n' + CODIGOS_PYTHON[tema.tag] + '\\n```');
    }

    entrenamiento.push({
      tag: tema.tag,
      categoria: tema.c,
      tema: tema.n,
      patterns: patrones,
      responses: respuestas,
      meta: {
        categoria: tema.c,
        fuente: wiki?.url || null,
        longitud_texto: wiki?.texto.length || 0,
        idioma: 'es',
        tiene_contenido: !!wiki,
        tiene_codigo: !!(tema.c === 'python' && CODIGOS_PYTHON[tema.tag])
      }
    });

    stats.tags++;
    stats.patrones += patrones.length;
    if (!wiki) stats.errores++;
    updateStats();

    if (stats.tags % 10 === 0) {
      log('✓ ' + stats.tags + ' tags · ' + stats.patrones + ' patrones', 'ok');
    }
  });
  await conLimite(tareasES, 4);

  // ========== APIs ==========
  if (usarAPIs) {
    log('📡 Procesando APIs...', 'prog');
    for (const api of APIS) {
      try {
        const r = await fetchT(api.u, 20000);
        if (r.ok) {
          let txt = r.text;
          try { txt = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) {}
          if (txt.length > 200) {
            const patrones = [api.n, 'dame ' + api.n, 'info de ' + api.n, 'qué es ' + api.n];
            entrenamiento.push({
              tag: 'api_' + api.n,
              categoria: 'api',
              tema: api.n,
              patterns: patrones,
              responses: ['**' + api.n + '** (datos en tiempo real):\\n\\n' + txt.slice(0, 1500)],
              meta: { categoria: 'api', fuente: api.u, tipo: 'api' }
            });
            stats.tags++;
            stats.patrones += patrones.length;
            log('✓ API ' + api.n, 'ok');
          }
        } else {
          stats.errores++;
        }
      } catch (e) { stats.errores++; }
      updateStats();
    }
  }

  // ========== Construir JSON final ==========
  const salida = {
    metadata: {
      version: '2.0',
      descripcion: 'Dataset generado por recolector.html — Ania: doctora, informática, fotógrafa, cinéfila, otaku, programadora Python',
      creado_por: 'Recolector (GitHub Pages)',
      fecha_actualizacion: new Date().toISOString(),
      contadores: {
        total_tags: stats.tags,
        total_patrones: stats.patrones,
        total_errores: stats.errores,
        categorias_incluidas: [...categoriasActivas]
      }
    },
    configuracion: {
      categorias: [...categoriasActivas],
      num_plantillas: PLANTILLAS.length,
      num_variantes: VARIANTES.length,
      incluye_wikipedia: true,
      incluye_apis: usarAPIs,
      incluye_codigo_python: usarCodigo
    },
    entrenamiento
  };

  const json = JSON.stringify(salida);
  stats.bytes = new Blob([json]).size;
  updateStats();

  resultado = salida;

  log('', 'info');
  log('✅ COMPLETADO', 'ok');
  log('📊 Tags: ' + stats.tags + ' · Patrones: ' + stats.patrones + ' · Errores: ' + stats.errores, 'ok');
  log('📦 Tamaño: ' + (stats.bytes/1024/1024).toFixed(2) + ' MB', 'ok');

  dlBtn.disabled = false;
  btn.disabled = false;
});

// Concurrencia limitada
async function conLimite(tareas, limite) {
  const cola = [...tareas];
  const workers = Array(limite).fill(0).map(async () => {
    while (cola.length) {
      const t = cola.shift();
      try { await t(); } catch (e) { stats.errores++; }
    }
  });
  await Promise.all(workers);
}

  if (!resultado) return;
  const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'entrenamiento.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log('💾 entrenamiento.json descargado (' + (blob.size/1024/1024).toFixed(2) + ' MB)', 'ok');
});
